id: c7cf1449-8506-4871-9a37-402b99ae26ec
name: Bulk secret retrieval from Key Vault
description: |
  Detects an identity reading secrets from Key Vault at a volume well above its own
  baseline. Maps directly to the PAM concern of credential harvesting — the cloud
  equivalent of someone pulling every account out of a vault safe at once.
severity: Medium
requiredDataConnectors:
  - connectorId: AzureKeyVault
    dataTypes:
      - AzureDiagnostics
queryFrequency: 1h
queryPeriod: 14d
triggerOperator: gt
triggerThreshold: 0
tactics:
  - Credentialaccess
relevantTechniques:
  - T1552.001        # Unsecured Credentials: Credentials In Files/Stores
query: |
  let baselineWindow = 14d;
  let evalWindow = 1h;
  let reads = AzureDiagnostics
    | where ResourceType == "VAULTS"
    | where OperationName == "SecretGet";
  let baseline = reads
    | where TimeGenerated between (ago(baselineWindow) .. ago(evalWindow))
    | summarize hourlyMean = count() / (baselineWindow / 1h) by identity_claim_upn_s;
  reads
  | where TimeGenerated > ago(evalWindow)
  | summarize reads = count(), vaults = dcount(Resource) by identity_claim_upn_s
  | join kind=leftouter baseline on identity_claim_upn_s
  // Fire when this hour's reads exceed 5x the identity's own hourly mean (min 20).
  | extend threshold = max_of(20.0, coalesce(hourlyMean, 0.0) * 5)
  | where reads > threshold
  | project identity_claim_upn_s, reads, vaults, hourlyMean, threshold
entityMappings:
  - entityType: Account
    fieldMappings:
      - identifier: FullName
        columnName: identity_claim_upn_s
version: 1.0.0
kind: Scheduled
